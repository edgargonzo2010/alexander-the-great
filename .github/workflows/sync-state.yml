# Folds dashboard check-offs from the private relay (kept ~12h) into st-q7m4k2xw.json so they survive.
# Commits only when something changed.
name: sync-state
on:
  schedule: [{cron: '7,22,37,52 * * * *'}]
  workflow_dispatch: {}
permissions: {contents: write}
concurrency: {group: sync-state, cancel-in-progress: false}
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: merge relay into state file
        run: python3 .github/scripts/st_merge.py st-q7m4k2xw.json --topic atg-r7wHouVMwEonIYFMIUA41keBaSXc
      - name: commit if changed
        run: |
          git diff --quiet && { echo "no change"; exit 0; }
          git config user.name "atg-sync"; git config user.email "atg-sync@users.noreply.github.com"
          git add st-q7m4k2xw.json && git commit -qm "sync state" && git push -q
