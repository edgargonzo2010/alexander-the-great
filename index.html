  --good:#059669; --warn:#b45309; --bad:#e11d48; --info:#2563eb; --gap:#64748b; --violet:#7c3aed;

  --g-good:linear-gradient(90deg,#059669,#34d399); --g-warn:linear-gradient(90deg,#f59e0b,#facc15); --g-bad:linear-gradient(90deg,#e11d48,#fb923c);
  --g-blue:linear-gradient(90deg,#2563eb,#06b6d4); --g-violet:linear-gradient(90deg,#7c3aed,#db2777); --g-brand:linear-gradient(90deg,#f97316,#fbbf24);
  --track:rgba(15,23,42,.07);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 12px 32px -18px rgba(15,23,42,.18);
  --shadow-hi:0 1px 2px rgba(15,23,42,.05),0 24px 48px -22px rgba(15,23,42,.28);
  --side-bg:rgba(255,255,255,.7);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-variant-numeric:tabular-nums;font-feature-settings:"tnum","cv11","ss01"}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(700px 500px at 18% -8%,var(--orb1),transparent 65%),radial-gradient(800px 600px at 105% 10%,var(--orb2),transparent 60%),radial-gradient(700px 600px at 50% 115%,var(--orb3),transparent 60%)}
b{font-weight:640}
code{font-family:var(--mono);font-size:.9em;background:var(--glass-3);padding:1px 6px;border-radius:6px}
button,select,input,textarea{font:inherit;color:inherit}
::selection{background:rgba(255,138,31,.3)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}

/* ================= sidebar ================= */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);z-index:60;display:flex;flex-direction:column;gap:6px;padding:22px 14px 16px;
  background:var(--side-bg);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border-right:1px solid var(--line);transition:transform .35s var(--ease)}
.side .brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px}
.side .brand img{height:24px;width:auto;display:block}
.logo-light{display:none!important}
:root[data-theme="light"] .logo-light{display:block!important;border-radius:6px}
:root[data-theme="light"] .logo-dark{display:none!important}
.side .ws{margin:0 6px 14px;padding:12px;border-radius:var(--r-sm);background:var(--glass-2);border:1px solid var(--line)}
.side .ws .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:650}
.side .ws .v{font-size:13.5px;font-weight:650;margin-top:2px}
.side .ws .fresh{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11.5px;font-weight:600}
.navlbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:650;padding:8px 12px 4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--text-2);font-weight:550;font-size:13.5px;transition:background .2s var(--ease),color .2s var(--ease),transform .2s var(--ease);position:relative}
.nav a svg{width:17px;height:17px;flex:none;opacity:.8}
.nav a:hover{background:var(--glass-3);color:var(--text)}
.nav a.active{background:var(--glass-3);color:var(--text)}
.nav a.active::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--g-brand)}
.nav a.active svg{opacity:1;color:var(--brand)}
.nav a .badge{margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--bad-bg);color:var(--bad)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 4px}
.sbtn{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--glass-2);cursor:pointer;font-size:13px;font-weight:600;color:var(--text-2);transition:all .2s var(--ease);width:100%}
.sbtn:hover{color:var(--text);border-color:var(--line-2);background:var(--glass-3)}
.sbtn svg{width:16px;height:16px}
.sbtn .kbd{margin-left:auto;font-size:10.5px;color:var(--muted);border:1px solid var(--line-2);border-radius:5px;padding:0 5px}

/* mobile top bar + bottom nav */
.mbar{display:none}
.bnav{display:none}
.scrim{display:none}

/* ================= main ================= */
.main{margin-left:var(--side);min-height:100vh}
.wrap{max-width:1320px;margin:0 auto;padding:30px 40px 100px}

/* header */
.hdr{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:22px}
.hdr .eyebrow{font-size:12px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;background:var(--g-brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.hdr h1{margin:6px 0 0;font-size:36px;line-height:1.08;letter-spacing:-.035em;font-weight:760}
.hdr .sub{margin-top:8px;color:var(--text-2);font-size:14px}
.hdr .mission{margin-top:10px;color:var(--muted);font-size:13px;max-width:720px}
.glance{margin-left:auto;display:grid;grid-template-columns:repeat(4,auto);gap:8px}
.gchip{display:flex;flex-direction:column;gap:2px;padding:10px 14px;min-width:92px;border-radius:var(--r-sm);background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);transition:transform .25s var(--ease)}
.gchip:hover{transform:translateY(-2px)}
.gchip b{font-size:24px;font-weight:760;letter-spacing:-.02em;line-height:1.1}
.gchip span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2);font-weight:550}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.good{background:var(--good);box-shadow:0 0 0 3px var(--good-bg)} .dot.warn{background:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)} .dot.bad{background:var(--bad);box-shadow:0 0 0 3px var(--bad-bg)} .dot.info{background:var(--info);box-shadow:0 0 0 3px var(--info-bg)}
.dot.gap{background:transparent;border:1.5px dashed var(--gap)}

/* freshness alert */
.stale{position:relative;display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:var(--r);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.stale::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(120deg,var(--tone-c),transparent 45%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.stale::after{content:"";position:absolute;left:-40px;top:-60px;width:220px;height:180px;background:radial-gradient(closest-side,var(--tone-bg),transparent);pointer-events:none}
.stale.bad{--tone-c:var(--bad);--tone-bg:var(--bad-bg)} .stale.warn{--tone-c:var(--warn);--tone-bg:var(--warn-bg)} .stale.good{--tone-c:var(--good);--tone-bg:var(--good-bg)}
.stale .ic{position:relative;z-index:1;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none;background:var(--tone-bg)}
.stale .body{position:relative;z-index:1;flex:1;min-width:0}
.stale .tt{font-weight:680;font-size:14.5px;letter-spacing:-.01em}
.stale .dd{font-size:13px;color:var(--text-2);margin-top:2px}
.stale .age{position:relative;z-index:1;text-align:right;flex:none}
.stale .age b{display:block;font-size:34px;line-height:1;font-weight:780;letter-spacing:-.03em;color:var(--tone-c)}
.stale .age span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:650}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:12px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend b{color:var(--text-2)}

/* sections */
section.sec{margin-top:52px}
.sec-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px}
.sec-h h2{margin:0;font-size:20px;letter-spacing:-.025em;font-weight:720}
.sec-h .hint{font-size:12.5px;color:var(--muted)}
.sec-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:620;padding:3px 10px;border-radius:999px;white-space:nowrap;border:1px solid transparent;line-height:1.5}
.pill.good{color:var(--good);background:var(--good-bg);border-color:color-mix(in srgb,var(--good) 22%,transparent)}
.pill.warn{color:var(--warn);background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 22%,transparent)}
.pill.bad{color:var(--bad);background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 22%,transparent)}
.pill.info{color:var(--info);background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 22%,transparent)}
.pill.gap{color:var(--gap);background:var(--gap-bg);border:1px dashed color-mix(in srgb,var(--gap) 60%,transparent)}
.pill.neutral{color:var(--text-2);background:var(--glass-3);border-color:var(--line)}

.card{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px;min-width:0;
  backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s var(--ease)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.04),transparent 40%)}
.card h3{margin:0;font-size:12.5px;font-weight:600;color:var(--text-2);letter-spacing:.005em}
.card .note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}

/* ================= attention: task list ================= */
.tasks{border-radius:var(--r-lg);background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow:hidden}
.aq{display:flex;flex-direction:column}
.aq-item{display:grid;grid-template-columns:28px 1fr auto;gap:14px;align-items:start;padding:16px 20px;border-bottom:1px solid var(--line);transition:background .2s var(--ease),opacity .35s var(--ease),transform .35s var(--ease),max-height .35s var(--ease)}
.aq-item:hover{background:var(--glass-2)}
.aq-item:last-child{border-bottom:0}
.aq-item.removing{opacity:0;transform:translateX(16px)}
.check{width:22px;height:22px;margin-top:1px;border-radius:7px;border:1.5px solid var(--line-2);background:transparent;display:grid;place-items:center;cursor:pointer;padding:0;transition:all .2s var(--ease);color:transparent}
.check svg{width:14px;height:14px;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s var(--ease) .05s}
.check:hover{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.check:hover svg{stroke-dashoffset:12}
.check.done{background:var(--g-good);border-color:transparent;color:#fff;transform:scale(1.08)}
.check.done svg{stroke-dashoffset:0}
.aq-item.checked .aq-act{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.aq-main{min-width:0}
.aq-top{display:flex;gap:10px;align-items:baseline}
.aq-rank{font-size:11.5px;font-weight:650;color:var(--muted);font-family:var(--mono);flex:none;min-width:18px}
.aq-act{font-weight:600;font-size:14.5px;line-height:1.45;letter-spacing:-.005em}
.aq-why{font-size:13px;color:var(--text-2);margin-top:4px;padding-left:28px}
.aq-flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;padding-left:28px}
.aq-flags .pill{white-space:normal}
.aq-side{display:flex;gap:6px;align-items:center}
.aq-empty{padding:28px;text-align:center;color:var(--text-2)}
.aq-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line);background:var(--glass-2)}
.aq-foot .hint{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--glass-2);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;transition:all .2s var(--ease)}
.btn:hover{background:var(--glass-3);border-color:var(--line-2);transform:translateY(-1px)}
.btn.primary{background:var(--text);color:var(--bg);border-color:transparent}
.btn.primary:hover{box-shadow:0 8px 20px -8px rgba(255,138,31,.6)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:0 8px;height:28px}
.btn.ghost:hover{color:var(--bad);transform:none}
.addform{display:none;gap:10px;grid-template-columns:2fr 2fr 1fr 1fr auto;align-items:end;padding:16px 20px;border-top:1px solid var(--line)}
.addform.open{display:grid;animation:fadeUp .3s var(--ease)}
.addform label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.08em}
.addform input,.addform select{height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--glass-2);padding:0 12px;font-size:14px;text-transform:none;letter-spacing:0;width:100%;transition:border-color .2s}
.addform input:focus,.addform select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,138,31,.18)}
.completed-list{margin-top:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--glass-2)}
.completed-list summary{cursor:pointer;color:var(--text-2);font-size:13px;font-weight:600;padding:12px 16px}
.completed-list .row{display:flex;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.completed-list .row span{flex:1;text-decoration:line-through}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ================= bento ================= */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;grid-auto-flow:dense}
.b-6{grid-column:span 6}.b-5{grid-column:span 5}.b-4{grid-column:span 4}.b-3{grid-column:span 3}.b-7{grid-column:span 7}.b-8{grid-column:span 8}.b-12{grid-column:span 12}
.r-2{grid-row:span 2}
.kpi{display:flex;flex-direction:column;overflow:hidden}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi);border-color:var(--line-2)}
.kpi .glow{position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;filter:blur(30px);opacity:.5;pointer-events:none;background:radial-gradient(closest-side,var(--glow,transparent),transparent)}
.kpi.tone-good{--glow:var(--good-bg)} .kpi.tone-warn{--glow:var(--warn-bg)} .kpi.tone-bad{--glow:var(--bad-bg)} .kpi.tone-info{--glow:var(--info-bg)}
.kpi .kh{display:flex;align-items:center;gap:8px;min-height:24px;position:relative}
.kpi .kh h3{flex:1}
.kpi .kv{font-size:40px;font-weight:760;letter-spacing:-.04em;margin-top:14px;line-height:1;position:relative}
.kpi .kv.xl{font-size:56px}
.kpi .kv small{font-size:14px;color:var(--muted);font-weight:550;letter-spacing:0;margin-left:4px}
.kpi .ks{font-size:12.5px;color:var(--text-2);margin-top:10px;position:relative}
.kpi .grow{flex:1}
.hbars{display:flex;flex-direction:column;gap:14px;margin-top:22px;position:relative}
.hbar .lbl{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--text-2);margin-bottom:7px}
.hbar .lbl b{color:var(--text);font-size:14px;font-weight:680}
.hbar .trk{height:8px;background:var(--track);border-radius:999px;overflow:hidden}
.hbar .fill{height:100%;border-radius:999px;transform-origin:left;animation:grow 1s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.trio div{padding:12px;border-radius:var(--r-sm);background:var(--glass-2);border:1px solid var(--line);font-size:11.5px;color:var(--text-2)}
.trio b{display:block;font-size:24px;font-weight:740;letter-spacing:-.03em;color:var(--text);margin-top:2px}
@media (max-width:640px){.trio{gap:8px}.trio div{padding:10px 8px}.trio b{font-size:clamp(14px,4.6vw,20px)}}
.funnel{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:20px;position:relative}
.funnel .st{height:46px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;border-radius:12px;color:#fff;font-size:12.5px;font-weight:600;box-shadow:0 10px 24px -14px rgba(0,0,0,.6);transition:transform .25s var(--ease)}
.funnel .st:hover{transform:scale(1.02)}
.funnel .st b{font-size:16px;font-weight:720}
.ringwrap{display:flex;align-items:center;gap:20px;margin-top:16px;position:relative}
.ring{width:112px;height:112px;flex:none}
.ring .arc{animation:dash 1.2s var(--ease) both}
@keyframes dash{from{stroke-dashoffset:var(--c)}}
.gauge-trk{position:relative;height:8px;border-radius:999px;background:var(--track);margin:20px 0 8px}
.gauge-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.gauge-mark{position:absolute;top:-7px;bottom:-7px;width:2px;border-radius:2px;background:var(--text);transform:translateX(-1px)}
.gauge-mark span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--text-2);white-space:nowrap;font-weight:600}
.gauge-mark.below span{top:auto;bottom:-20px}
.gauge-pin{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);border:4px solid var(--bg);box-shadow:0 0 0 1px var(--line-2),0 4px 10px rgba(0,0,0,.3)}
.gauge-scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
.gapchip{display:inline-flex;align-items:center;gap:8px;font-size:18px;font-weight:650;color:var(--gap);border:1.5px dashed color-mix(in srgb,var(--gap) 60%,transparent);border-radius:12px;padding:6px 14px;letter-spacing:-.01em}
.unblock{margin-top:14px;padding:12px 14px;border-radius:var(--r-sm);background:var(--glass-2);border:1px dashed var(--line-2);font-size:12.5px;color:var(--text-2)}
.unblock b{color:var(--text)}

/* ================= factoring ================= */
.fsum{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.fstat{padding:16px;border-radius:var(--r);background:var(--glass-2);border:1px solid var(--line);transition:transform .25s var(--ease),border-color .25s}
.fstat:hover{transform:translateY(-2px);border-color:var(--line-2)}
.fstat .d{font-size:11px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.08em}
.fstat .v{font-size:24px;font-weight:740;margin-top:8px;letter-spacing:-.03em}
.fstat .n{font-size:12px;color:var(--text-2);margin-top:6px}
.fstat.good{background:linear-gradient(160deg,var(--good-bg),transparent 70%);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.fstat.good .v{background:var(--g-good);-webkit-background-clip:text;background-clip:text;color:transparent}
.flowbar{display:flex;height:14px;border-radius:999px;overflow:hidden;margin-top:14px;gap:3px}
.flowbar div{min-width:6px;border-radius:999px;transition:filter .2s}
.flowbar div:hover{filter:brightness(1.15)}
.flowlegend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:12px;margin-top:14px;font-size:12px;color:var(--text-2);align-items:start}
.flowlegend > span{display:flex;flex-direction:column;gap:2px}
.flowlegend > span b{font-size:15px;color:var(--text);font-weight:680}
.flowlegend i{width:10px;height:10px;border-radius:4px;display:inline-block;margin-right:6px;vertical-align:-1px}
.flowlegend .net{text-align:right}
.flowlegend .net b{font-size:20px;background:var(--g-good);-webkit-background-clip:text;background-clip:text;color:transparent}
.tblwrap{overflow-x:auto;margin-top:16px;border:1px solid var(--line);border-radius:var(--r)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--glass-2)}
table.t td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tbody tr{transition:background .15s}
table.t tbody tr:hover{background:var(--glass-2)}
table.t .num{text-align:right;white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t tr.tot td{font-weight:680;background:var(--glass-2)}
table.t tr.hi td{background:var(--good-bg)}

.wrap{max-width:1400px;padding:18px 24px 100px}
/* sidebar target card */
.starget{margin:10px 6px 8px;padding:12px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line)}
.starget .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.starget>b{display:block;font-size:19px;font-weight:780;letter-spacing:-.02em;margin-top:4px}
.starget .of{font-size:11.5px;color:var(--text-2)}
.starget .tb{height:7px;border-radius:9px;background:var(--track);margin-top:10px;overflow:hidden}
.starget .tb i{display:block;height:100%;border-radius:inherit;background:var(--g-brand)}
.starget .tp{display:flex;justify-content:space-between;font-size:11.5px;margin-top:6px;color:var(--text-2)}
.starget .tp b{color:var(--brand)}
.starget .ft{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.4}
@media (max-height:820px) and (min-width:981px){.side .ws{display:none}}
/* top bar */
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.topbar h1{margin:0;font-size:22px;line-height:1.1;font-weight:820;letter-spacing:.01em;text-transform:uppercase}
.topbar .sub{font-size:12px;color:var(--text-2);margin-top:3px}
.tb-r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:9px;background:var(--glass);border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.fchip b{color:var(--text);font-weight:620}
.xbtn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 15px;border-radius:9px;border:0;background:var(--brand);color:#fff;font-weight:700;font-size:12.5px;cursor:pointer;box-shadow:0 8px 20px -10px rgba(255,138,31,.9);transition:filter .2s,transform .2s}
.xbtn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.xbtn svg{width:15px;height:15px}
/* overview */
.cc{display:flex;flex-direction:column;gap:12px;margin-bottom:22px;scroll-margin-top:18px}
.cc-kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.cc-k,.cc-p,.cc-s{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.cc-k{padding:11px 12px 10px;transition:border-color .2s,transform .2s}
.cc-k:hover{border-color:var(--line-2);transform:translateY(-2px)}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-2);font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kr{display:flex;align-items:center;gap:9px;margin-top:8px}
.rw{position:relative;width:42px;height:42px;flex:none}
.rw span{position:absolute;inset:0;display:grid;place-items:center;font-size:9.5px;font-weight:760;letter-spacing:-.02em}
.ring{width:42px;height:42px;display:block}
.ring circle,.donut circle{fill:none}
.ring .rt{stroke:var(--track);stroke-width:4.5}
.ring .rv{stroke-width:4.5;stroke-linecap:round;filter:drop-shadow(0 0 3px currentColor)}
.kv2{min-width:0}
.rn.ex{color:var(--text-2);font-size:10px}
.kr+.rn{margin-top:7px}
.kv2 b{display:block;font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.dl{display:block;margin-top:7px;padding-top:6px;border-top:1px solid var(--line);font-size:10.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.dl.up{color:var(--good)} .dl.bad{color:var(--bad)}
.rn{display:block;font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-row{display:grid;gap:12px}
.cc-row.r3{grid-template-columns:1.15fr 1fr .95fr}
.cc-row.r3b{grid-template-columns:1.4fr 1fr .9fr}
.cc-p{padding:14px 16px 12px;display:flex;flex-direction:column}
.cc-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cc-tag{margin-left:auto;font-size:11px;color:var(--brand);font-weight:650;white-space:nowrap}
.cc-foot{font-size:11px;color:var(--muted);margin-top:auto;padding-top:10px;line-height:1.45}
/* hbar */
.hb{display:flex;flex-direction:column;gap:9px}
.hbr{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:center}
.hbk{font-size:12px;color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.hbk small{display:block;font-size:10px;color:var(--muted);font-weight:500}
.hbt{height:22px;border-radius:5px;background:var(--glass-2);position:relative}
.hbf{height:100%;border-radius:5px;background:linear-gradient(90deg,#1d4ed8,#3b82f6 60%,#22d3ee);box-shadow:0 0 14px -2px rgba(59,130,246,.55);display:flex;align-items:center;justify-content:flex-end;padding-right:7px;transform-origin:left;animation:grow .8s var(--ease) both}
.hbr:first-child .hbf{background:linear-gradient(90deg,#c2410c,#ff8a1f 60%,#ffb547);box-shadow:0 0 14px -2px rgba(255,138,31,.6)}
.hbf span{font-size:11px;font-weight:720;color:#fff;white-space:nowrap}
.hbax{display:grid;grid-template-columns:118px 1fr;gap:10px}
.hbax div{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.hbax i{font-style:normal}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* donut */
.dn{display:flex;align-items:center;gap:16px}
.dnw{position:relative;width:132px;height:132px;flex:none}
.donut{width:100%;height:100%}
.donut .rt{stroke:var(--track);stroke-width:20}
.donut circle{stroke-width:20}
.dnc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dnc b{font-size:18px;font-weight:820;letter-spacing:-.03em;color:var(--brand)}
.dnc span{font-size:10px;color:var(--muted);max-width:80px;line-height:1.2}
.lg{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.lg div{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-2)}
.lg i{width:9px;height:9px;border-radius:3px;flex:none}
.lg span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg b{color:var(--text);font-weight:700}
/* stacked */
.stk{display:flex;gap:12px;align-items:stretch;height:168px}
.stky{display:flex;flex-direction:column;justify-content:space-between;font-size:9.5px;color:var(--muted);padding-bottom:22px}
.stky i{font-style:normal;line-height:1}
.stc{width:54px;display:flex;flex-direction:column;gap:6px;flex:none}
.stb{flex:1;display:flex;flex-direction:column-reverse;border-radius:6px;overflow:hidden;background:var(--glass-2)}
.stb div{display:flex;align-items:center;justify-content:center;min-height:2px;animation:fade .8s var(--ease) both}
.stb span{font-size:10.5px;font-weight:760;color:#0a1120}
.stl{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.2;white-space:nowrap}
.stl b{display:block;color:var(--text);font-size:12px}
.lg-v{justify-content:center;gap:5px}
.lgx{font-size:10.5px!important;color:var(--muted)!important;display:block!important;line-height:1.35;margin-top:4px}
.lgx b{color:var(--text-2)!important}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* table */
.ct{width:100%;border-collapse:collapse;font-size:12px}
.ct th{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;text-align:left;padding:0 6px 7px;border-bottom:1px solid var(--line)}
.ct td{padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.ct .num{text-align:right}
.ct .mono{white-space:nowrap;font-family:var(--mono);font-size:11px;color:var(--text-2)}
.ct .cd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}
.ct td.st-paid{color:var(--good);font-weight:700}.ct td.st-overdue{color:var(--bad);font-weight:700}.ct td.st-sent{color:var(--info);font-weight:650}
.ct .st-unpaid{color:var(--warn)}.ct tr.tot td{border-bottom:0;font-weight:760;color:var(--brand)}
.ct tbody tr:not(.tot):hover td{background:var(--glass-2)}
.ctw{overflow-x:auto;margin:0 -4px}
.ct td.cu{max-width:170px;overflow:hidden;text-overflow:ellipsis}
.ct th,.ct td{padding-left:5px;padding-right:5px}
/* area */
.area{width:100%;height:auto;display:block}
.area .gl{stroke:var(--line);stroke-dasharray:3 4}
.area .ax{font-size:10px;fill:var(--muted)}
.area .al{fill:none;stroke:#ff8a1f;stroke-width:2.5;stroke-linejoin:round}
.area .ad{fill:var(--glass);stroke:#ff8a1f;stroke-width:2}
.area .ad.pk{fill:#ff8a1f;stroke:#fff}
.area .pkb{fill:#16a34a}
.area .pkt{font-size:9.5px;font-weight:800;fill:#fff;letter-spacing:.02em}
/* alerts */
.al-l{display:flex;flex-direction:column;gap:6px}
.ali{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border-radius:9px;background:var(--glass-2);border:1px solid var(--line);border-left:3px solid var(--c)}
.ali.bad{--c:var(--bad)}.ali.warn{--c:var(--warn)}.ali.good{--c:var(--good)}.ali.info{--c:#22d3ee}
.ali svg{width:16px;height:16px;flex:none;color:var(--c);margin-top:1px}
.ali b{display:block;font-size:12px;font-weight:720}
.ali span{display:block;font-size:10.5px;color:var(--text-2);line-height:1.4}
.al-more{margin-top:10px;font-size:11.5px;color:var(--brand);font-weight:650;text-decoration:none}
/* strip */
.cc-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.cc-s{display:flex;gap:12px;align-items:center;padding:12px 14px}
.si{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.si svg{width:18px;height:18px}
.cc-s>div:last-child{min-width:0}
.cc-s b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-s span{display:block;font-size:10.5px;color:var(--muted);line-height:1.35}
/* banner row under the overview */
.glrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:10px 2px 6px}
.glrow .legend{margin:0}
.glrow .glance{margin-left:auto}
.glrow .gchip{padding:6px 12px;min-width:80px;flex-direction:row;align-items:center;gap:8px}
.glrow .gchip b{font-size:17px}
.mission{font-size:12px;color:var(--muted);margin:4px 2px 26px}
.stale{padding:12px 16px}
.stale .dd{font-size:12.5px}
:root[data-theme="light"] .stb span{color:#0a1120}

.ct td.po-ok{color:var(--good);font-weight:650}.ct td.po-miss{color:var(--bad);font-weight:750}.ct td.po-na{color:var(--muted)}
.hbar .lbl{white-space:normal;overflow:visible}.hbar .lbl>span{min-width:0;overflow-wrap:anywhere}.hbar .lbl>b{flex:none}
.al-srcbar{font-size:10.5px;color:var(--text-2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin:-4px 0 8px;display:inline-block}
.al-src{display:block;font-style:normal;font-size:10px;color:var(--brand);margin-top:2px;font-weight:650}
.cc-tag.src{color:var(--text-2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-weight:600}
.apd .apsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.apsum>div{padding:10px 12px;border-radius:10px;background:var(--glass-2);border:1px solid var(--line)}
.apsum span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);font-weight:700}
.apsum b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.apsum small{display:block;font-size:10.5px;color:var(--muted)}
.apsum>div.hl b{color:var(--brand)}
.apgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.apg{padding:10px 12px;border-radius:10px;border:1px solid var(--line);border-top:3px solid var(--c);background:var(--glass-2);min-width:0}
.apg.bad{--c:var(--bad)}.apg.warn{--c:var(--warn)}.apg.good{--c:var(--good)}
.apg-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.apg-h span{margin-left:auto;font-size:10.5px;color:var(--muted)}
.apg .ct td{white-space:normal}
.apg .apst{font-size:10.5px;color:var(--muted)}
.apg tr.eur td{color:var(--violet)}
@media (max-width:1100px){.apgrid{grid-template-columns:1fr}}
@media (max-width:760px){.apd .apsum{grid-template-columns:1fr}
  .apg .ct td:nth-child(3){display:table-cell}.apg .ct td.apst{display:none}.apg .ct tr.tot td.apst{display:table-cell}
  .apd .cc-h{flex-wrap:wrap;gap:6px}.apd .cc-tag.src{white-space:normal}}
@media (max-width:1380px){
  .cc-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .cc-row.r3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cc-row.r3>:last-child{grid-column:span 2}
  .cc-strip{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (min-width:1381px){ .cc-kpis .cc-k:nth-child(n){} }
@media (max-width:760px){
  .cc-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cc-row.r3,.cc-row.r3b{grid-template-columns:1fr}
  .cc-row.r3>:last-child,.cc-row.r3b>:first-child{grid-column:auto}
  .cc-strip{grid-template-columns:1fr 1fr}
  .tb-r{margin-left:0}
  .topbar h1{font-size:19px}
  .ct{font-size:11.5px}
  .ct th:nth-child(3),.ct td:nth-child(3){display:none}
  .ct td{white-space:normal}
  .glrow .glance{margin-left:0;width:100%}
}
@media (max-width:420px){
  .cc-strip{grid-template-columns:1fr}
  .dn{flex-direction:column;align-items:stretch}.dnw{margin:0 auto}
  .fchip:not(.fresh-good):not(.fresh-warn):not(.fresh-bad){display:none}
  .kv2 b{font-size:18px}
}
@media print{.xbtn,.fchip{display:none}.cc-k,.cc-p,.cc-s{break-inside:avoid}}
</style>
<style>

.side{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(148,163,184,.25) transparent}.side>*{flex-shrink:0}

  --shadow-hi:0 1px 0 rgba(255,255,255,.05) inset,0 24px 50px -24px rgba(0,0,0,.9);
  --side-bg:#0f1114;
  --steel:linear-gradient(180deg,#22262c,#1b1e23);
}
:root[data-theme="light"]{
  --bg:#e9ebee;
  --orb1:rgba(255,106,26,.10); --orb2:rgba(100,110,125,.07); --orb3:rgba(255,179,71,.06);
  --glass:#f8f9fa; --glass-2:rgba(30,35,45,.035); --glass-3:rgba(30,35,45,.07);
  --line:rgba(30,35,45,.10); --line-2:rgba(30,35,45,.18);
  --text:#15181c; --text-2:#4a515b; --muted:#7c838d;
  --brand:#e85a0c; --brand-2:#f59e0b; --g-brand:linear-gradient(90deg,#e85a0c,#f59e0b);
  --brass:#9a7a10; --brass-2:#b8921a; --brass-bg:rgba(201,162,39,.16);
  --info:#475569; --info-bg:#e6e9ed;
  --side-bg:#f3f4f6; --steel:linear-gradient(180deg,#fbfbfc,#f1f2f4);
  --ember-glow:none;
}
body{background:var(--bg)}
:root[data-theme="dark"] body{background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,transparent 1px 4px),
  linear-gradient(180deg,#14171b,#101215 60%) fixed}
::selection{background:rgba(255,106,26,.32)}
:focus-visible{outline-color:var(--brand)}

/* condensed, forged headings */
.topbar h1,.sec-h h2,.card h3,.cc-h h3,.lbl,.navlbl,.side .ws .k,.starget .k,.forge-word,.fstat .d,table.t th,.ct th,.ck,.mc-h b,.vt b,.law b,.rh b,.fam b,.cdn b,.gchip b,.kv2 b,.cd-big{font-family:var(--cond)}
.topbar h1{font-size:34px;font-weight:700;letter-spacing:.06em;line-height:1}
.sec-h h2{font-size:22px;font-weight:600;letter-spacing:.06em}
.card h3,.cc-h h3{font-size:14px;font-weight:600;letter-spacing:.08em}
.lbl{font-size:12.5px;font-weight:500;letter-spacing:.09em}
.navlbl,.side .ws .k,.starget .k{font-size:12px;font-weight:500;letter-spacing:.14em}
table.t th,.ct th{font-size:12px;font-weight:500;letter-spacing:.1em}
.kv2 b{font-size:24px;font-weight:600;letter-spacing:.01em}
.gchip b{font-weight:600;letter-spacing:.01em}

/* steel cards with a forged top edge */
.cc-k,.cc-p,.cc-s,.card,.tasks{background:var(--steel);border-color:var(--line)}
.cc-p,.card,.tasks{position:relative}
.cc-p::after,.tasks::after,.card.edge::after{content:"";position:absolute;left:14px;right:14px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,106,26,.55),transparent);pointer-events:none}
.nav a.active{background:var(--g-brand);color:#1a0d04;box-shadow:0 6px 18px -8px rgba(255,106,26,.75)}
.nav a.active svg{color:#1a0d04}
.nav a.active .badge{background:rgba(0,0,0,.18);color:#1a0d04}
.xbtn{background:var(--g-brand);color:#1a0d04;box-shadow:0 8px 20px -10px rgba(255,106,26,.9)}
.btn.primary:hover{box-shadow:0 8px 20px -8px rgba(255,106,26,.6)}
.cc-tag{color:var(--brand)}
.ember{color:var(--brand);text-shadow:var(--ember-glow)}
.brass{color:var(--brass)}
.pill.brass{color:var(--brass-2);background:var(--brass-bg);border-color:color-mix(in srgb,var(--brass) 40%,transparent)}
:root[data-theme="light"] .pill.brass{color:var(--brass)}
.pill.ember{color:var(--brand);background:rgba(255,106,26,.12);border-color:rgba(255,106,26,.35)}
.dot.brass{background:var(--brass);box-shadow:0 0 0 3px var(--brass-bg)}
.dot.ember{background:var(--brand);box-shadow:0 0 0 3px rgba(255,106,26,.18),0 0 10px rgba(255,106,26,.7)}

/* sidebar brand: forged wordmark */
.side .brand{padding:2px 8px 16px;gap:11px}
.forge-mark{width:40px;height:40px;flex:none;display:block}
.forge-word{display:flex;flex-direction:column;line-height:1}
.forge-word b{font-size:25px;font-weight:700;letter-spacing:.12em;background:linear-gradient(180deg,#fff2e0,#ffb347 55%,#ff6a1a);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme="light"] .forge-word b{background:linear-gradient(180deg,#3a2a1a,#e85a0c);-webkit-background-clip:text;background-clip:text}
.forge-word span{font-size:10.5px;letter-spacing:.2em;color:var(--muted);margin-top:4px;font-weight:500;text-transform:uppercase}
.mbar .forge-mark{width:30px;height:30px}
.mbar .forge-word b{font-size:20px}
.mbar .forge-word span{display:none}
.starget>b{font-family:var(--cond);font-weight:600;font-size:22px;letter-spacing:.02em}
.starget .tp b{color:var(--brand)}

/* top bar */
.topbar{align-items:flex-end}
.topbar .sub{font-size:12.5px;margin-top:6px}
.topbar .tag{font-size:12px;color:var(--muted);margin-top:4px;font-style:italic}
.topbar .tag b{font-style:normal;color:var(--brass);font-weight:600}
.h1row{display:flex;align-items:center;gap:10px}
.h1row svg{width:28px;height:28px;color:var(--brand);filter:drop-shadow(0 0 6px rgba(255,106,26,.6))}
.fchip.hot{border-color:rgba(255,106,26,.4)}
.fchip.hot b{color:var(--brand);text-shadow:var(--ember-glow)}

/* KPI tiles */
.cc-kpis .kv2 b.ember{color:var(--brand)}
.kv2 b.gapv{color:var(--gap);font-size:18px;font-family:var(--font);font-weight:650;letter-spacing:-.01em}
.rw span{font-family:var(--cond);font-size:11px;font-weight:600;letter-spacing:.02em}

/* countdown */
.cdn{display:flex;gap:10px;align-items:flex-end;margin:4px 0 6px}
.cdn div{flex:1;text-align:center;padding:12px 4px 8px;border-radius:10px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
:root[data-theme="light"] .cdn div{background:rgba(30,35,45,.05)}
.cdn b{display:block;font-size:44px;font-weight:700;line-height:1;color:var(--brand);text-shadow:var(--ember-glow);letter-spacing:.01em}
.cdn span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-top:6px;font-weight:650}
.cd-meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--text-2);margin-top:8px}
.cd-meta b{color:var(--text)}
.heat{height:8px;border-radius:9px;background:var(--track);overflow:hidden;margin-top:10px}
.heat i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#5b6370,#ff6a1a 70%,#ffb347);box-shadow:0 0 12px rgba(255,106,26,.6)}
.cd-big{font-size:44px;font-weight:700;line-height:1}

/* current-op panel */
.opk{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:12.5px;margin-top:2px}
.opk dt{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;padding-top:2px}
.opk dd{margin:0;color:var(--text-2)}
.opk dd b{color:var(--text)}
.intent{font-size:13px;color:var(--text);border-left:3px solid var(--brand);padding:8px 12px;border-radius:0 8px 8px 0;background:rgba(255,106,26,.06);margin-bottom:12px;line-height:1.5}

/* campaign strip */
.strip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.sg{display:flex;flex-direction:column;gap:6px;min-width:0}
.sg .bar{height:10px;border-radius:4px;background:var(--track);overflow:hidden;position:relative}
.sg .bar i{display:block;height:100%}
.sg.done .bar i{background:linear-gradient(90deg,#9a7a10,#c9a227,#e6c65a)}
.sg.now .bar i{background:var(--g-brand);box-shadow:0 0 10px rgba(255,106,26,.7)}
.sg .m{font-family:var(--cond);font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.sg.done .m{color:var(--brass)} .sg.now .m{color:var(--brand)} .sg.up .m{color:var(--text-2)}
.sg .t{font-size:11px;color:var(--muted);line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* brief banner tones */
.stale.ember{--tone-c:var(--brand);--tone-bg:rgba(255,106,26,.13)}
.stale.ember .age b{text-shadow:var(--ember-glow)}

/* this-month mission list */
.cm-grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.cm-side{display:flex;flex-direction:column;gap:12px}
.aq-item.checked .aq-act{text-decoration:line-through;color:var(--muted)}
.check.done{background:linear-gradient(135deg,#9a7a10,#e6c65a);color:#1c1503}
.bb{font-size:12px;color:var(--text-2);margin-top:6px;padding-left:28px}
.bb b{color:var(--brand);font-weight:650;font-family:var(--cond);letter-spacing:.06em;text-transform:uppercase;font-size:11.5px;margin-right:4px}
.mini h3{margin-bottom:8px}
.mini p{margin:6px 0 0;font-size:12.5px;color:var(--text-2)}

/* month cards (timeline) */
.mgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.mc{padding:14px;border-radius:var(--r);background:var(--steel);border:1px solid var(--line);border-top:3px solid var(--c,var(--line-2));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0;transition:transform .2s var(--ease),border-color .2s}
.mc:hover{transform:translateY(-2px)}
.mc.done{--c:var(--brass)} .mc.now{--c:var(--brand);box-shadow:var(--shadow),0 0 0 1px rgba(255,106,26,.35),0 14px 40px -20px rgba(255,106,26,.55)}
.mc-h{display:flex;align-items:center;gap:8px}
.mc-h b{font-size:18px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.mc-h .pill{margin-left:auto}
.mc .th{font-weight:650;font-size:13.5px;line-height:1.3}
.mc .op{font-size:11.5px;color:var(--muted);font-style:italic}
.mc .op.named{color:var(--brand);font-style:normal;font-weight:650}
.mc.done .op.named{color:var(--brass)}
.mc dl{display:grid;grid-template-columns:62px 1fr;gap:4px 8px;margin:4px 0 0;font-size:11.5px}
.mc dt{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:700;padding-top:1px}
.mc dd{margin:0;color:var(--text-2);min-width:0;overflow-wrap:anywhere}
.mc dd.na{color:var(--gap);font-style:italic}

/* completed ops */
.ops2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.opc .ophead{display:flex;align-items:flex-start;gap:12px}
.coin{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#f4dc86,#c9a227 55%,#7d6210);color:#2a2005;font-family:var(--cond);font-weight:700;font-size:15px;box-shadow:0 0 0 2px rgba(201,162,39,.35),0 6px 18px -6px rgba(201,162,39,.6);letter-spacing:.04em}
.opc .ttl{font-family:var(--cond);font-size:20px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--brass);line-height:1.1}
.opc .st{font-size:12.5px;color:var(--text-2);margin-top:3px}
.opsub{font-family:var(--cond);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;font-weight:500}
.mlist{list-style:none;margin:0;padding:0}
.mlist li{padding:8px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--text-2)}
.mlist li b{color:var(--text);display:block;font-size:13px;margin-bottom:2px}
.gate{margin-top:12px;padding:10px 12px;border-radius:10px;border:1px dashed rgba(255,106,26,.45);background:rgba(255,106,26,.05);font-size:12.5px;color:var(--text-2)}
.gate b{color:var(--brand)}
.olog{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin-top:10px}
.olog select,.olog input,.rsel,.pl input{height:32px;border-radius:8px;border:1px solid var(--line-2);background:var(--glass-2);padding:0 8px;font-size:12.5px;color:var(--text);min-width:0}
.olog select:focus,.olog input:focus,.rsel:focus,.pl input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,106,26,.18)}
select option{background:#1c1f24;color:#eceef1}
:root[data-theme="light"] select option{background:#fff;color:#15181c}

/* standing orders */
.laws{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.law{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--steel);border:1px solid var(--line)}
.law .n{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;font-family:var(--cond);font-weight:700;font-size:16px;color:#1a0d04;background:var(--g-brand);box-shadow:0 0 12px -2px rgba(255,106,26,.6)}
.law b{display:block;font-size:15px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.law span{display:block;font-size:12.5px;color:var(--text-2);margin-top:2px}
.rhythm{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.rh{padding:14px;border-radius:var(--r);background:var(--steel);border:1px solid var(--line);min-width:0}
.rh svg{width:22px;height:22px;color:var(--brand)}
.rh b{display:block;font-size:16px;font-weight:600;letter-spacing:.08em;margin-top:8px}
.rh span{display:block;font-size:12px;color:var(--text-2);margin-top:4px;line-height:1.45}
.week{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:12px}
.wd{border-radius:10px;border:1px solid var(--line);background:var(--glass-2);padding:10px;min-width:0}
.wd b{display:block;font-family:var(--cond);font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.wd i{display:block;font-style:normal;font-size:11px;color:var(--text-2);margin-top:6px;padding:4px 7px;border-radius:6px;background:var(--glass-3)}
.wd i.ac{border-left:2px solid var(--info)} .wd i.fg{border-left:2px solid var(--brand)} .wd i.bb2{border-left:2px solid var(--brand);background:rgba(255,106,26,.10);color:var(--text)} .wd i.fd{border-left:2px solid var(--brass)}
.cols3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:16px;margin-top:16px}
.olist{margin:8px 0 0;padding-left:20px;font-size:12.5px;color:var(--text-2)}
.olist li{padding:3px 0}
.say{font-family:var(--cond);font-size:17px;letter-spacing:.04em;padding:8px 0;border-top:1px solid var(--line);color:var(--text)}
.say:first-of-type{border-top:0}
.say::before{content:"“";color:var(--brand)} .say::after{content:"”";color:var(--brand)}

/* character */
.vgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.vt{padding:14px;border-radius:var(--r);background:var(--steel);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.vt .mo{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.vt b{font-size:22px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;line-height:1.1}
.vt.done b{color:var(--brass)} .vt.now b{color:var(--brand);text-shadow:var(--ember-glow)}
.vt .vr{font-size:12px;color:var(--text-2)}
.vt .vq{font-size:11.5px;color:var(--text);font-style:italic;margin-top:2px}
.vt .vn{font-size:10.5px;color:var(--muted)}
.vt label{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-2);margin-top:auto;padding-top:8px;cursor:pointer}
.vt input{accent-color:var(--brass);width:15px;height:15px}

/* reading list */
.rsel{height:30px}
.rs-fin{color:var(--brass-2)!important;border-color:color-mix(in srgb,var(--brass) 50%,transparent)!important}
.rs-rd{color:var(--brand)!important;border-color:rgba(255,106,26,.45)!important}
td.na{color:var(--gap);font-style:italic}

/* business tracker */
.fsum .fstat .v.gapv{color:var(--gap);font-size:18px;font-weight:650}
.fstat.giving{background:linear-gradient(160deg,var(--brass-bg),transparent 70%);border-color:color-mix(in srgb,var(--brass) 35%,transparent)}
.fstat.giving .v{color:var(--brass-2)}
.fstat .v{font-family:var(--cond);font-weight:600;letter-spacing:.02em}
.pl input{width:100%;max-width:120px;text-align:right;font-variant-numeric:tabular-nums}
.pl td.c{text-align:right;white-space:nowrap;color:var(--text-2)}
.pl td.c.gv{color:var(--brass-2);font-weight:650}
.pl td.c.nl{color:var(--gap);font-style:italic;font-size:12px}
.pl tr.now td{background:rgba(255,106,26,.05)}
.pl tr.tot td{font-weight:700}

/* binder */
.bgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.bc{padding:12px 14px;border-radius:var(--r);background:var(--steel);border:1px solid var(--line);min-width:0}
.bc.now{border-color:rgba(255,106,26,.45)}
.bc-h{display:flex;align-items:center;gap:8px}
.bc-h b{font-family:var(--cond);font-size:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.bc-h span{margin-left:auto;font-size:11.5px;color:var(--text-2);font-weight:650}
.bc .heat{margin:8px 0 6px;height:6px}
.bc.full .heat i{background:linear-gradient(90deg,#9a7a10,#e6c65a);box-shadow:none}
.bc label{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--text-2);padding:4px 0;cursor:pointer;line-height:1.35}
.bc input{accent-color:var(--brass);margin-top:1px;flex:none;width:14px;height:14px}
.bc label.on{color:var(--muted);text-decoration:line-through}

/* family */
.fgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.fam{padding:16px;border-radius:var(--r);background:var(--steel);border:1px solid var(--line);min-width:0}
.fam .av{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--cond);font-size:17px;font-weight:700;letter-spacing:.04em;color:#1a0d04;background:var(--g-brand);box-shadow:0 0 14px -4px rgba(255,106,26,.7)}
.fam.alex .av{background:linear-gradient(135deg,#7d6210,#e6c65a);color:#1c1503;box-shadow:0 0 14px -4px rgba(201,162,39,.7)}
.fam>b{display:block;font-size:18px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-top:12px}
.fam .rl{font-size:11.5px;color:var(--brand);font-weight:650}
.fam p{font-size:12.5px;color:var(--text-2);margin:8px 0 0}

.wkfix{font-size:12px;color:var(--text-2);margin-top:12px;padding:10px 12px;border-radius:10px;border:1px dashed color-mix(in srgb,var(--warn) 50%,transparent);background:var(--warn-bg)}
.wkfix b{color:var(--warn)}
td .sub2{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}

/* fixes after first render */
.kv2{min-width:0;flex:1}
.kv2 b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv2 b.sm{font-size:18px;white-space:normal;line-height:1.1}
.kv2 b.gapv{font-size:15px;white-space:normal;line-height:1.15}
td.inc .pill,.mlist .pill,.cm-side .pill,.aq-flags .pill{white-space:normal}
td.mo{white-space:nowrap}
table.t td.dcell{white-space:nowrap}
table.t td.inc{min-width:200px;max-width:260px}
table.t td.chc{min-width:300px}
table.t tr.hi td{background:rgba(255,106,26,.07)}
.law:last-child:nth-child(odd){grid-column:1/-1}
.subh h3{font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:16px}
.ali b span.mo2{display:inline;color:var(--muted);font-weight:500}
@media (max-width:420px){.fchip.hot{display:inline-flex}}
@media (max-width:640px){table.t.stack td.chc,table.t.stack td.dcell{display:block} table.t.stack td.chc::before,table.t.stack td.dcell::before{display:block;max-width:none;margin-bottom:3px} table.t.stack td.dcell .sub2{display:inline;margin-left:6px} table.t td.chc{min-width:0} table.t td.inc{max-width:none} table.t.stack td{text-align:left} table.t.stack td>*{text-align:left}}
.ali.info{--c:#8b939e}
/* responsive */
@media (max-width:1380px){
  .mgrid,.vgrid,.bgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .fgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rhythm{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:1100px){
  .cm-grid2,.ops2,.cols3{grid-template-columns:1fr}
  .laws{grid-template-columns:1fr}
}
@media (max-width:760px){
  .mgrid,.vgrid,.bgrid,.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .strip{grid-template-columns:repeat(5,minmax(0,1fr));row-gap:12px}

@keyframes dpop{0%{transform:scale(1)}45%{transform:scale(1.28);box-shadow:0 0 0 8px rgba(201,162,39,.25),0 0 22px rgba(201,162,39,.7)}100%{transform:scale(1)}}

function bindDaily(){
  const el=$('#daily');

  el.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const d=b.dataset;
    if(d.dcomp){ const row=b.closest('.dt'); b.classList.add('pop'); row.classList.add('leaving');
      setTimeout(()=>{ const k=dkey(today()), r=dayRec(k); r.done[d.dcomp]=new Date().toISOString(); S.daily.hist[k]=r; saveDay(); dJust=d.dcomp; renderDaily(); const all=todaysTasks().every(t=>dayRec(k).done[t.id]); toast(all?'Day complete 🔥':'Done ✓'); },380); }
    else if(d.dundo){ const k=dkey(today()), r=dayRec(k); delete r.done[d.dundo]; S.daily.hist[k]=r; saveDay(); renderDaily(); toast('Moved back to To Do'); }

  const c=curMonth(), el=$('#misList'); if(!el) return;
  el.innerHTML=c.missions.map((x,i)=>{ const on=!!S.missions[x.id];
    const flags=[]; if(x.due) flags.push(`<span class="pill ember">${fmtShort(parseD(x.due))}</span>`); if(x.tag) flags.push(`<span class="pill gap">${x.tag}</span>`);
    return `<div class="aq-item ${on?'checked':''}"><button class="check ${on?'done':''}" type="button" data-mis="${x.id}" aria-label="Toggle done" title="Toggle done">${CHECK}</button>
      <div class="aq-main"><div class="aq-top"><div class="aq-act">${x.t}</div></div><div class="aq-why">${x.d}</div>${x.bb?`<div class="bb"><b>Backbrief</b>“${x.bb}”</div>`:''}${flags.length?`<div class="aq-flags">${flags.join('')}</div>`:''}</div><div class="aq-side"></div></div>`; }).join('');
  const n=c.missions.filter(x=>S.missions[x.id]).length; $('#misCount').textContent=`${n} / ${c.missions.length} done`;
}

/* ---------- campaign (months + completed ops + character + reading) ---------- */
function monthBody(m){
  const s=status(m), past=endOf(m.challenge.due)<now, o=S.outcomes[m.id]||{}, v=S.books[m.id]||'';
  return `<div class="mb">
    <div><div class="opsub">Missions</div><ul class="mlist">${m.missions.map(x=>`<li><b>${x.t}</b>${x.d}</li>`).join('')}</ul>
      ${m.gate?`<div class="gate"><b>Safety Gate:</b> ${m.gate}</div>`:''}</div>
    <div><div class="opsub">Field Day</div><ul class="mlist">${m.field.map(f=>`<li><b>${f.t}${f.d?` · ${fmtShort(parseD(f.d))}`:f.dl?` · ${f.dl}`:''}</b>${f.note||''}</li>`).join('')}</ul>
      <div class="opsub">🏁 ${m.challenge.name} · ${fmtShort(parseD(m.challenge.due))}</div><ul class="mlist"><li>${m.challenge.desc}${m.challenge.incentive?`<br><span class="pill brass" style="margin-top:8px">${m.kind==='money'?'💵':'🎖️'} ${m.challenge.incentive}</span>`:''}</li></ul></div>
    <div class="trk2"><div class="opsub">Track</div>
      ${m.book?`<label class="tl">Book <select class="rsel ${v==='fin'?'rs-fin':v==='rd'?'rs-rd':''}" data-book="${m.id}">${Object.keys(RS).map(k=>`<option value="${k}" ${v===k?'selected':''}>${RS[k]}</option>`).join('')}</select></label>`:''}
      <label class="tl ck2"><input type="checkbox" data-verse="${m.id}" ${S.verses[m.id]?'checked':''}> Verse recited from memory</label>
      ${past?`<label class="tl">Challenge <select class="rsel" data-out="${m.id}">${Object.keys(OUT).map(k=>`<option value="${k}" ${(o.v||'')===k?'selected':''}>${OUT[k]}</option>`).join('')}</select></label><input class="onote" data-outnote="${m.id}" placeholder="Result / AAR note" value="${esc(o.n||'')}">`:''}
    </div></div>`;
}
function campaignSec(){
  return `<section class="sec" id="campaign"><div class="sec-h"><h2>🗺️ Campaign</h2><span class="hint">tap a month to open it</span></div>
    <div class="mrows"><div class="mr-hd"><span>Month</span><span>Theme</span><span>Character</span><span>Book</span><span></span></div>
    ${M.map(m=>{ const s=status(m); return `<details class="mrow ${s}"><summary>
      <span class="c1"><b>${m.short}</b>${stPill(m)}</span>
      <span class="c2"><b>${m.theme}</b><i class="${m.op?'named':''}">${m.op||'Operation TBD'}</i></span>
      <span class="c3"><b>${m.virtue}</b><i>${m.verse}</i></span>
      <span class="c4 ${m.book?'':'na'}">${m.book||'—'}</span>
      <span class="chev">›</span></summary>${monthBody(m)}</details>`; }).join('')}</div></section>`;
}

/* ---------- deadlines ---------- */
function deadlinesSec(){
  const rows=M.map(m=>{ const s=status(m), d=daysTo(m.challenge.due), past=endOf(m.challenge.due)<now, o=(S.outcomes[m.id]||{}).v||'';
    const cd = past?`<select class="rsel" data-out="${m.id}" aria-label="Outcome for ${esc(m.short)}">${Object.keys(OUT).map(k=>`<option value="${k}" ${o===k?'selected':''}>${OUT[k]}</option>`).join('')}</select>`
      :d===0?'<span class="pill ember">Due today</span>':`<span class="pill ${s==='now'?'ember':'neutral'}"><b data-days="${m.challenge.due}" data-suffix=" days">${d} days</b></span>`;
    return `<tr class="${s==='now'?'hi':''}"><td data-h="Date" class="dcell"><b>${fmtShort(parseD(m.challenge.due))}</b></td><td data-h="Month" class="mo">${m.short}</td><td data-h="Challenge" class="chc"><b>${m.challenge.name}</b></td><td data-h="${past?'Result':'Countdown'}" class="num">${cd}</td></tr>`; }).join('');
  return `<section class="sec" id="deadlines"><div class="sec-h"><h2>⏱️ Deadlines</h2><span class="hint">these do not move</span></div>
    <div class="card" style="padding:0;overflow:hidden"><div class="tblwrap" style="margin:0;border:0;border-radius:0"><table class="t stack dlt"><thead><tr><th>Date</th><th>Month</th><th>Challenge</th><th class="num">Countdown / Result</th></tr></thead><tbody id="dlBody">${rows}</tbody></table></div></div>
    <div class="wkfix"><b>Weekday check:</b> the brief says Fri Oct 31, Sat Jan 31 and Sun May 31, but those dates fall on Sat, Sun and Mon. Confirm with Dad.</div></section>`;
}

/* ---------- business ---------- */
function businessSec(){
  return `<section class="sec" id="business"><div class="sec-h"><h2>💼 Business</h2><span class="hint">10% to giving, off the top, always</span></div>
    <div class="fsum" id="plSum"></div>
    <div class="card" style="padding:0;overflow:hidden;margin-top:16px"><div class="tblwrap pl" style="margin:0;border:0;border-radius:0"><table class="t stack"><thead><tr><th>Month</th><th class="num">Revenue</th><th class="num">Costs</th><th class="num">Profit</th><th class="num">10% Giving</th><th class="num">Kept</th></tr></thead><tbody id="plBody"></tbody></table></div></div></section>`;
}
function renderPL(){
  const body=$('#plBody'); if(!body) return;
  const t=plTotals(), cur=curMonth();
  body.innerHTML=M.map(m=>{ const r=S.pl[m.id]||{}, has=(r.rev!==undefined&&r.rev!=='')||(r.cost!==undefined&&r.cost!==''), p=(+r.rev||0)-(+r.cost||0);
    return `<tr class="${m===cur?'now':''}"><td data-h="Month"><b>${m.short}</b></td>
      <td data-h="Revenue" class="num"><input inputmode="decimal" data-pl="${m.id}" data-f="rev" value="${esc(r.rev??'')}" placeholder="—" aria-label="${m.short} revenue"></td>
      <td data-h="Costs" class="num"><input inputmode="decimal" data-pl="${m.id}" data-f="cost" value="${esc(r.cost??'')}" placeholder="—" aria-label="${m.short} costs"></td>
      ${has?`<td data-h="Profit" class="c">${money(p)}</td><td data-h="10% Giving" class="c gv">${money(Math.max(0,p)*.1)}</td><td data-h="Kept" class="c">${money(p-Math.max(0,p)*.1)}</td>`:`<td data-h="Profit" class="c nl">—</td><td data-h="10% Giving" class="c nl">—</td><td data-h="Kept" class="c nl">—</td>`}</tr>`; }).join('')
    + `<tr class="tot"><td data-h="Total">Year to date</td><td data-h="Revenue" class="c">${t.n?money(t.rev):'—'}</td><td data-h="Costs" class="c">${t.n?money(t.cost):'—'}</td><td data-h="Profit" class="c">${t.n?money(t.profit):'—'}</td><td data-h="10% Giving" class="c gv">${t.n?money(t.give):'—'}</td><td data-h="Kept" class="c">${t.n?money(t.profit-t.give):'—'}</td></tr>`;
  const v=x=>t.n?`<div class="v">${money(x)}</div>`:`<div class="v gapv">Not logged</div>`;
  $('#plSum').innerHTML=`<div class="fstat"><div class="d">Profit YTD</div>${v(t.profit)}</div><div class="fstat giving"><div class="d">10% Giving</div>${v(t.give)}</div><div class="fstat"><div class="d">Kept</div>${v(t.profit-t.give)}</div>`;
}

/* ---------- binder ---------- */
function binderSec(){
  return `<section class="sec" id="binder"><div class="sec-h"><h2>🗂️ Binder</h2><span class="hint">one per month · a portfolio by May</span><div class="right"><span class="pill neutral" id="bCount"></span></div></div><div class="bgrid" id="bGrid"></div></section>`;
}
function renderBinder(){
  const g=$('#bGrid'); if(!g) return; let tot=0,on=0; const cur=curMonth();
  g.innerHTML=M.map(m=>{ const items=m.binder.map((b,i)=>({id:m.id+'-b'+i,t:b})); const n=items.filter(x=>S.binder[x.id]).length; tot+=items.length; on+=n;
    return `<div class="bc ${m===cur?'now':''} ${n===items.length?'full':''}"><div class="bc-h"><b>${m.short}</b><span>${n}/${items.length}</span></div><div class="heat"><i style="width:${(n/items.length*100).toFixed(0)}%"></i></div>
      ${items.map(x=>`<label class="${S.binder[x.id]?'on':''}"><input type="checkbox" data-bind="${x.id}" ${S.binder[x.id]?'checked':''}>${x.t}</label>`).join('')}</div>`; }).join('');
  $('#bCount').textContent=`${on} / ${tot}`;
}

/* ---------- standing orders + family ---------- */
function ordersSec(){
  return `<section class="sec" id="orders"><div class="sec-h"><h2>📜 Standing Orders</h2></div>
    <div class="laws">${F.laws.map((l,i)=>`<div class="law"><div class="n">${i+1}</div><div><b>${l[0]}</b><span>${l[1]}</span></div></div>`).join('')}</div>
    <div class="subh"><h3>The Rhythm</h3></div>
    <div class="rhythm" style="margin-top:14px">${F.rhythm.map(r=>`<div class="rh">${svg(r[2])}<b>${r[0]}</b><span>${r[1]}</span></div>`).join('')}</div>
    <div class="sayrow">${F.sayings.map(s=>`<div class="say">${s}</div>`).join('')}</div>
    <div class="subh"><h3>The Family</h3></div>
    <div class="fgrid" style="margin-top:14px">${F.cast.map(c=>`<div class="fam ${c.k==='Alex'?'alex':''}"><div class="av">${c.ini}</div><b>${c.k}</b><div class="rl">${c.role}</div><p>${c.d}</p></div>`).join('')}</div></section>`;
}

/* ---------- live ---------- */
function tick(){
  now=new Date();
  const h=nextHack(); if(h){ const ms=Math.max(0,endOf(h.challenge.due)-now), d=Math.floor(ms/DAY), hr=Math.floor(ms%DAY/36e5), mi=Math.floor(ms%36e5/6e4);
    $$('[data-cd="d"]').forEach(e=>e.textContent=d); $$('[data-cd="h"]').forEach(e=>e.textContent=String(hr).padStart(2,'0')); $$('[data-cd="m"]').forEach(e=>e.textContent=String(mi).padStart(2,'0')); }
  $$('[data-days]').forEach(e=>{ const n=daysTo(e.dataset.days); e.textContent=n+(e.dataset.suffix!==undefined?e.dataset.suffix:' days'); });
  const tl=$('#todayLbl'); if(tl) tl.textContent=fmtLong(now);
  const k=dkey(today()); if(tick._k&&tick._k!==k&&!dEditing) renderDaily(); tick._k=k;
}

/* ---------- navigation ---------- */
function navInit(){
  const nav=$('#nav');
  nav.innerHTML=SECTIONS.map(s=>`<a href="#${s[0]}" data-id="${s[0]}">${svg(s[0])}<span>${s[1]}</span></a>`).join('');
  const quick=['overview','current','campaign','deadlines'];
  $('#bnav').innerHTML=quick.map(id=>`<a href="#${id}" data-id="${id}">${svg(id)}<span>${SECTIONS.find(s=>s[0]===id)[1]}</span></a>`).join('')+`<button type="button" id="bMore">${svg('more')}<span>More</span></button>`;
  $('#bMore').addEventListener('click',()=>document.body.classList.add('nav-open'));
  nav.addEventListener('click',e=>{ if(e.target.closest('a')) closeNav(); });
  const links=$$('#nav a, #bnav a');
  if(!('IntersectionObserver' in window)) return;
  const io=new IntersectionObserver(ents=>ents.forEach(en=>{ if(!en.isIntersecting) return; links.forEach(a=>a.classList.toggle('active',a.dataset.id===en.target.id)); }),{rootMargin:'-25% 0px -65% 0px'});
  SECTIONS.forEach(s=>{ const el=document.getElementById(s[0]); if(el) io.observe(el); });
}

/* ---------- interactions (same saved-data shape as v1: forge_v1) ---------- */
function bind(){
  const app=$('#app');
  app.addEventListener('click',e=>{ const b=e.target.closest('[data-mis]'); if(!b) return;
    const id=b.dataset.mis; if(S.missions[id]) delete S.missions[id]; else S.missions[id]=new Date().toISOString().slice(0,10); save();
    const go=()=>{ renderMissions(); renderDaily(); toast(S.missions[id]?'Mission done 🔥':'Mission reopened'); };
    go(); });
  app.addEventListener('change',e=>{ const t=e.target, d=t.dataset;
    if(d.out){ S.outcomes[d.out]=Object.assign(S.outcomes[d.out]||{},{v:t.value}); save(); $$(`[data-out="${d.out}"]`).forEach(x=>{ if(x!==t) x.value=t.value; }); toast('Result saved'); }
    else if(d.outnote){ S.outcomes[d.outnote]=Object.assign(S.outcomes[d.outnote]||{},{n:t.value.trim()}); save(); toast('Note saved'); }
    else if(d.verse){ if(t.checked) S.verses[d.verse]=1; else delete S.verses[d.verse]; save(); }
    else if(d.book){ S.books[d.book]=t.value; save(); t.className='rsel '+(t.value==='fin'?'rs-fin':t.value==='rd'?'rs-rd':''); }
    else if(d.bind){ if(t.checked) S.binder[d.bind]=1; else delete S.binder[d.bind]; save(); renderBinder(); }
    else if(d.pl){ const v=t.value.replace(/[$,\s]/g,''); if(v!==''&&isNaN(+v)){ toast('Numbers only'); t.value=''; return; } S.pl[d.pl]=Object.assign(S.pl[d.pl]||{},{[d.f]:v}); if(S.pl[d.pl].rev===''&&S.pl[d.pl].cost==='') delete S.pl[d.pl]; save(); renderPL(); toast('Saved'); }
  });
}

/* ---------- boot ---------- */
function boot(){
  sideTarget();
  $('#app').innerHTML = overview() + currentSec() + campaignSec() + deadlinesSec() + businessSec() + binderSec() + ordersSec()
    + `<footer><p><b>THE FORGE</b> · ${F.meta.tagline} ${F.meta.taglineRef}</p></footer>`;
  navInit(); bind(); bindDaily(); renderDaily(); renderMissions(); renderPL(); renderBinder(); tick();
  setInterval(tick,30000);
}
if(document.readyState!=='loading') boot(); else document.addEventListener('DOMContentLoaded',boot);
})();
</script>
</body>
</html>
